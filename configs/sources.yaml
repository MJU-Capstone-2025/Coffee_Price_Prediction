# 수집 소스 요약. API 요청은 02_backfill_10y.py, 기상 좌표는 regions.yaml에서 관리한다.
# 관측일은 발표일과 다를 수 있다. 가격 결측과 범위 이탈 값은 임의 보정하지 않는다.
periods:
  pilot: {start: "2023-12-31", end: "2025-12-31"}
  backfill: {start: "2016-01-01", end: "2025-12-31"}

prediction:
  target: future_log_return_5d
  formula: "ln(Close[t+5] / Close[t])"
  horizon: 5
  horizon_unit: trading_sessions
  cutoff_utc: "23:00:00"
  baseline_features: [close_momentum, close_volatility, brl, fred, weather_30d, cot_net_ratio]
  # 거래일 누락과 학습/평가 경계를 확인한 뒤 라벨을 만든다.

yahoo:
  interface: yfinance.Ticker.history
  interval: 1d
  end_inclusive: false
  options: {auto_adjust: false, back_adjust: false, repair: false, keepna: true}
  datasets:
    - {symbol: "KC=F", file: coffee.parquet, unit: US_cents_per_lb}
    - {symbol: "BRL=X", file: brl.parquet, unit: BRL_per_USD}
  # Close는 Yahoo 제공값. 공식 Settlement와 동일하다고 확인한 것은 아니다.

fred:
  endpoint: "https://api.stlouisfed.org/fred/series/observations"
  key_env: FRED_API_KEY
  end_inclusive: true
  missing_value: "."
  datasets:
    - {series_id: DFF, description: 실효 연방기금금리, frequency: daily, unit: percent}
    - {series_id: DTWEXBGS, description: 광의 명목 달러지수, frequency: business_daily, unit: "Jan_2006=100"}
    - {series_id: DCOILWTICO, description: WTI 현물, frequency: business_daily, unit: USD_per_barrel}

nasa:
  endpoint: "https://power.larc.nasa.gov/api/temporal/daily/point"
  community: AG
  time_standard: UTC
  end_inclusive: true
  regions_file: configs/regions.yaml
  buffer_days: 30  # 요청 기간 앞뒤로 추가 수집.
  variables:
    PRECTOTCORR: mm/day
    T2M: Celsius
    T2M_MIN: Celsius
    T2M_MAX: Celsius
    RH2M: percent
  # 응답에 선언된 fill_value를 NaN으로 바꾼다.

cftc:
  endpoint: "https://www.cftc.gov/files/dea/history/fut_disagg_txt_{year}.zip"
  report_type: Disaggregated_Futures_Only
  market_code: "083731"
  frequency: weekly
  unit: contracts
  # date는 포지션 기준일. 모델에 붙일 때 발표일을 별도로 고려한다.
